name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # The verify job exercises the stub-only (CGO_ENABLED=0) build path so
    # unit tests run without needing libkrfiles.{so,dylib}. The cgo-enabled
    # path is validated end-to-end in the per-target build-matrix jobs
    # below, which each fetch the matching krfiles native artifact.
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION matches plugin.json
        run: |
          FILE_VERSION=$(cat VERSION)
          MANIFEST_VERSION=$(jq -r .version plugin.json)
          if [ "$FILE_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::VERSION file ($FILE_VERSION) does not match plugin.json version ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Validate plugin.json schema
        run: |
          # Minimal validation — make sure the manifest parses and has the
          # fields the Mattermost server will look up.
          jq -e '.id and .server.executables and .settings_schema' plugin.json > /dev/null

  build-matrix:
    # Each matrix job runs on a runner whose native OS/arch matches the
    # target — we do not cross-compile because the cgo shim links against
    # a krfiles native library fetched from a release archive, and the
    # host toolchain needs to match the target ABI. Treat each runner as
    # a first-class build host.
    name: Build (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-amd64
            os: macos-13
          - target: darwin-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Fetch krfiles native artifacts
        run: ./build/fetch-krfiles.sh ${{ matrix.target }}

      - name: Build native plugin binary
        # CGO_LDFLAGS_ALLOW permits the rpath forms cgo's security
        # allowlist rejects by default (@loader_path on macOS, $ORIGIN on
        # Linux). Both are whitelisted here rather than in krf_cgo.go
        # because cgo evaluates the allowlist at the package level before
        # expansion.
        env:
          CGO_ENABLED: '1'
          CGO_LDFLAGS_ALLOW: '-Wl,-rpath,(@loader_path|\$ORIGIN).*'
        run: |
          mkdir -p server/dist/${{ matrix.target }}
          go build -trimpath -o server/dist/${{ matrix.target }}/plugin ./server
          # Drop the matching shared library next to the binary. The
          # bundle job (release.yml) and every Mattermost server rely on
          # this being in the same directory as the binary because the
          # linker baked rpath=@loader_path (Darwin) / $ORIGIN (Linux).
          cp server/fb/krf/native/libkrfiles.* server/dist/${{ matrix.target }}/

      - name: Verify the binary dynamically links libkrfiles
        # Catches regressions where krf_shim_bridge.c disappears or the
        # plugin somehow gets built without cgo: either mistake produces a
        # static binary that silently skips the share command at runtime.
        run: |
          if [[ "${{ matrix.target }}" == darwin-* ]]; then
            if ! otool -L server/dist/${{ matrix.target }}/plugin | grep -q "libkrfiles.dylib"; then
              echo "::error::plugin binary does not link libkrfiles.dylib"
              otool -L server/dist/${{ matrix.target }}/plugin
              exit 1
            fi
          else
            if ! ldd server/dist/${{ matrix.target }}/plugin 2>/dev/null | grep -q "libkrfiles.so"; then
              echo "::error::plugin binary does not link libkrfiles.so"
              ldd server/dist/${{ matrix.target }}/plugin || true
              exit 1
            fi
          fi

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: server/dist/${{ matrix.target }}/
