name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION file matches tag
        run: |
          FILE_VERSION=$(cat VERSION)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION file ($FILE_VERSION) does not match tag (v$TAG_VERSION)"
            exit 1
          fi

      - name: Verify plugin.json matches tag
        run: |
          MANIFEST_VERSION=$(jq -r .version plugin.json)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::plugin.json version ($MANIFEST_VERSION) does not match tag (v$TAG_VERSION)"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    strategy:
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - target: darwin-amd64
            os: macos-13
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build server binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p server/dist
          go build -trimpath -o server/dist/plugin-${{ matrix.target }} ./server

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: server/dist/plugin-${{ matrix.target }}

  bundle:
    name: Bundle plugin tarball
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all server binaries
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Assemble plugin bundle
        run: |
          mkdir -p bundle/server/dist
          find downloaded -type f -name 'plugin-*' -exec cp {} bundle/server/dist/ \;
          chmod +x bundle/server/dist/plugin-*
          cp plugin.json bundle/
          [ -f assets/icon.svg ] && mkdir -p bundle/assets && cp assets/icon.svg bundle/assets/ || true
          tar czf mattermost-plugin-filebrowser-${{ needs.validate.outputs.version }}.tar.gz -C bundle .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: |
            mattermost-plugin-filebrowser-${{ needs.validate.outputs.version }}.tar.gz
